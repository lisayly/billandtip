<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d98da">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS: these are what make it launch as an app from the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "default" keeps the app below the status bar; "black-translucent" would
     let the clock and battery sit on top of the picture -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Palavras">
<meta name="format-detection" content="telephone=no">
<title>Palavras</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS ignores the manifest icons and uses this one, at 180x180 -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="card" class="card">
      <div id="listen-ring" class="listen-ring"></div>
      <div id="emoji" class="emoji">⚽</div>
    </div>
    <div id="edge-left" class="edge edge-left" aria-hidden="true"></div>
    <div id="edge-right" class="edge edge-right" aria-hidden="true"></div>
    <div id="parent-dot" aria-hidden="true"></div>
  </div>

  <div id="parent-panel" class="hidden">
    <div class="parent-scroll">
      <div class="parent-header">
        <h1>Modo dos pais</h1>
        <button id="parent-close" class="pbtn pbtn-primary">Voltar para o app</button>
      </div>

      <p class="parent-hint">
        Ela ouve as palavras em inglês. Grave sua própria voz em inglês para as
        palavras que você quiser — o que não tiver gravação usa voz sintética
        automaticamente. Toque para gravar (●), ouvir (▶) ou apagar (✕).
      </p>

      <button id="record-all" class="pbtn pbtn-record-all">
        🎙️ Gravar todas as palavras com a sua voz
      </button>

      <div class="parent-status" id="mic-status"></div>

      <div id="word-list" class="word-list"></div>

      <div class="parent-footer">
        <button id="reset-progress" class="pbtn pbtn-danger">Reiniciar progresso</button>
      </div>
    </div>
  </div>

  <!-- Guided pass: record the whole set in one sitting, one word at a time. -->
  <div id="record-all-panel" class="hidden">
    <div class="ra-top">
      <span id="ra-counter" class="ra-counter"></span>
      <button id="ra-exit" class="pbtn">Sair</button>
    </div>

    <div class="ra-middle">
      <div id="ra-emoji" class="ra-emoji"></div>
      <div id="ra-word" class="ra-word"></div>
      <div id="ra-sub" class="ra-sub"></div>
    </div>

    <div class="ra-bottom">
      <div id="ra-status" class="ra-status"></div>
      <div class="ra-level"><div id="ra-level-fill" class="ra-level-fill"></div></div>
      <div id="ra-help" class="ra-help"></div>
      <button id="ra-record" class="ra-record">●</button>
      <div class="ra-actions">
        <button id="ra-play" class="pbtn pbtn-play">▶ Ouvir</button>
        <button id="ra-skip" class="pbtn">Pular ›</button>
      </div>
    </div>
  </div>

  <script src="js/words.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/parent.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
